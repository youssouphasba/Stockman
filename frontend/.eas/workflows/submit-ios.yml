name: Submit iOS build to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Identifiant du build iOS à soumettre
        type: string
        required: true

jobs:
  submit_ios:
    name: Submit iOS
    type: submit
    env:
      EXPO_DEBUG: "1"
    params:
      platform: ios
      profile: production-remote
      build_id: ${{ inputs.build_id }}
